name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Windows is the target platform (Word PDF export, PowerShell setup); the Word test skips without Office.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
